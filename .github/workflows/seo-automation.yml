name: Reusable Master SEO Automation CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  seo-build-check-index:
    # IndexNow runs in deploy.yml, for changed URLs only, once the build is live.
    name: Build & Audit SEO Health
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build Web Application
        run: npm run build

      - name: Automated Build-Time SEO Health Check (0 Errors Enforced)
        run: python3 scripts/seo_health_check.py
