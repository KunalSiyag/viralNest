name: 🚀 Automated Satellite Blog Drip Publisher

on:
  schedule:
    # Runs at 09:00 AM UTC every Tuesday and Friday
    - cron: '0 9 * * 2,5'
  workflow_dispatch:
    # Allows manual trigger anytime from GitHub Actions tab

permissions:
  contents: write

jobs:
  drip-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 📡 Execute Drip Publisher Script
        env:
          WP_SITE_URL: ${{ secrets.WP_SITE_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_API_TOKEN: ${{ secrets.BLOGGER_API_TOKEN }}
        run: node scripts/drip_publisher.mjs

      - name: 💾 Commit & Push Updated Post Queue Status
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add content/posts/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(drip-publisher): update published status [skip ci]" && git push)
