name: 🚀 Automated Satellite Blog Drip Publisher

on:
  schedule:
    # Runs at 09:00 AM UTC every Tuesday and Friday
    - cron: '0 9 * * 2,5'
  workflow_dispatch:
    # Allows manual trigger anytime from GitHub Actions tab

permissions:
  contents: write

jobs:
  drip-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true
          fetch-depth: 0

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 📡 Execute Drip Publisher Script
        env:
          WP_SITE_URL: ${{ secrets.WP_SITE_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_API_TOKEN: ${{ secrets.BLOGGER_API_TOKEN }}
        run: node scripts/drip_publisher.mjs

      - name: 💾 Commit & Push Updated Post Queue Status
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add content/posts/
          if ! git diff --quiet || ! git diff --staged --quiet; then
            git commit -m "chore(drip-publisher): update published status [skip ci]"
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push origin main; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "❌ Failed to push drip-publisher updates after $attempt attempts."
                exit 1
              fi
              echo "⚠️ Push attempt $attempt failed due to concurrent updates. Retrying..."
              sleep 3
            done
          fi
